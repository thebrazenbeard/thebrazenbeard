<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">Engineering principles</title>
  <desc id="desc">Evidence over narrative, capability is not authority, missing evidence is not a pass, and state must change behavior.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1420"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .box{fill:#111923;stroke:#2d3a4b;stroke-width:1.2}
      .pulse{animation:pulse 2.8s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="210" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="208" rx="19" fill="none" stroke="#30363d"/>

  <g class="mono">
    <text x="40" y="38" font-size="13" fill="#6e7681" letter-spacing="2">OPERATING PRINCIPLES</text>

    <g transform="translate(40 62)">
      <rect width="260" height="105" rx="14" class="box"/>
      <circle cx="28" cy="28" r="5" fill="#58a6ff" class="pulse"/>
      <text x="46" y="34" font-size="13" fill="#8b949e">01</text>
      <text x="22" y="69" font-size="18" font-weight="700" fill="#f0f6fc">EVIDENCE &gt; NARRATIVE</text>
      <text x="22" y="91" font-size="11" fill="#79c0ff">claims inherit their evidence ceiling</text>
    </g>

    <g transform="translate(320 62)">
      <rect width="260" height="105" rx="14" class="box"/>
      <circle cx="28" cy="28" r="5" fill="#7ee787" class="pulse"/>
      <text x="46" y="34" font-size="13" fill="#8b949e">02</text>
      <text x="22" y="69" font-size="18" font-weight="700" fill="#f0f6fc">CAPABILITY ≠ AUTHORITY</text>
      <text x="22" y="91" font-size="11" fill="#7ee787">possible does not mean permitted</text>
    </g>

    <g transform="translate(600 62)">
      <rect width="260" height="105" rx="14" class="box"/>
      <circle cx="28" cy="28" r="5" fill="#f2cc60" class="pulse"/>
      <text x="46" y="34" font-size="13" fill="#8b949e">03</text>
      <text x="22" y="69" font-size="17" font-weight="700" fill="#f0f6fc">MISSING EVIDENCE ≠ PASS</text>
      <text x="22" y="91" font-size="11" fill="#f2cc60">unknown must remain visible</text>
    </g>

    <g transform="translate(880 62)">
      <rect width="280" height="105" rx="14" class="box"/>
      <circle cx="28" cy="28" r="5" fill="#d2a8ff" class="pulse"/>
      <text x="46" y="34" font-size="13" fill="#8b949e">04</text>
      <text x="22" y="69" font-size="18" font-weight="700" fill="#f0f6fc">STATE → BEHAVIOR</text>
      <text x="22" y="91" font-size="11" fill="#d2a8ff">persistence should change the next act</text>
    </g>
  </g>
</svg>