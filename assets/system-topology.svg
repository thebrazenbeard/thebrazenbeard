<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Core system topology</title>
  <desc id="desc">V.E.R.A. at the center with Project Runner, Rezon, Ingest, F.U.C.K.U.P., SQL Connectome, and LGCM around it.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow2"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .node{fill:#111923;stroke:#303d4f;stroke-width:1.4}
      .node2{fill:#0d1c2a;stroke:#2f6f9f;stroke-width:1.8}
      .edge{stroke:#27435e;stroke-width:1.4;fill:none}
      .edge2{stroke:#385a78;stroke-width:1;fill:none;stroke-dasharray:6 8}
      .pulse{animation:pulse 2.5s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
    </style>
    <path id="p1" d="M520 270 L320 150"/>
    <path id="p2" d="M680 270 L880 150"/>
    <path id="p3" d="M500 320 L280 320"/>
    <path id="p4" d="M700 320 L920 320"/>
    <path id="p5" d="M520 370 L330 500"/>
    <path id="p6" d="M680 370 L870 500"/>
  </defs>

  <rect width="1200" height="640" rx="22" fill="url(#bg2)"/>
  <rect x="1" y="1" width="1198" height="638" rx="21" fill="none" stroke="#30363d"/>

  <g class="mono">
    <text x="50" y="55" font-size="14" fill="#79c0ff" letter-spacing="2">CORE SYSTEM TOPOLOGY</text>
    <text x="50" y="82" font-size="12" fill="#6e7681">A portfolio map — not a claim of runtime wiring.</text>

    <path d="M520 270 L320 150" class="edge"/>
    <path d="M680 270 L880 150" class="edge"/>
    <path d="M500 320 L280 320" class="edge"/>
    <path d="M700 320 L920 320" class="edge"/>
    <path d="M520 370 L330 500" class="edge"/>
    <path d="M680 370 L870 500" class="edge"/>

    <path d="M185 365 C220 430 230 455 305 475" class="edge2"/>
    <path d="M1000 365 C970 430 960 455 895 475" class="edge2"/>
    <path d="M355 126 C500 85 700 85 845 126" class="edge2"/>

    <g>
      <circle r="4" fill="#58a6ff" class="pulse"><animateMotion dur="4.6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
      <circle r="4" fill="#a371f7" class="pulse"><animateMotion dur="5.1s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
      <circle r="4" fill="#7ee787" class="pulse"><animateMotion dur="4.1s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
      <circle r="4" fill="#f2cc60" class="pulse"><animateMotion dur="5.4s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
      <circle r="4" fill="#79c0ff" class="pulse"><animateMotion dur="4.8s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle>
      <circle r="4" fill="#d2a8ff" class="pulse"><animateMotion dur="5.7s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion></circle>
    </g>

    <g transform="translate(440 245)">
      <rect width="320" height="150" rx="18" class="node2"/>
      <circle cx="38" cy="40" r="8" fill="#58a6ff" filter="url(#glow2)" class="pulse"/>
      <text x="60" y="47" font-size="29" font-weight="700" fill="#f0f6fc">V.E.R.A.</text>
      <text x="30" y="82" font-size="13" fill="#8b949e">Virtual Environment for Reciprocal Agency</text>
      <text x="30" y="112" font-size="12" fill="#79c0ff">state · evidence · governance · runtime</text>
    </g>

    <g transform="translate(110 105)">
      <rect width="300" height="105" rx="14" class="node"/>
      <text x="22" y="35" font-size="19" font-weight="700" fill="#f0f6fc">PROJECT RUNNER</text>
      <text x="22" y="61" font-size="12" fill="#8b949e">multi-repo orchestration kernel</text>
      <text x="22" y="82" font-size="11" fill="#58a6ff">dependency · work · evidence</text>
    </g>

    <g transform="translate(790 105)">
      <rect width="300" height="105" rx="14" class="node"/>
      <text x="22" y="35" font-size="19" font-weight="700" fill="#f0f6fc">REZON</text>
      <text x="22" y="61" font-size="12" fill="#8b949e">heterogeneous reasoning system</text>
      <text x="22" y="82" font-size="11" fill="#a371f7">decompose · challenge · verify</text>
    </g>

    <g transform="translate(40 267)">
      <rect width="300" height="105" rx="14" class="node"/>
      <text x="22" y="35" font-size="19" font-weight="700" fill="#f0f6fc">INGEST</text>
      <text x="22" y="61" font-size="12" fill="#8b949e">provider-neutral intake boundary</text>
      <text x="22" y="82" font-size="11" fill="#7ee787">raw · normalize · hash · provenance</text>
    </g>

    <g transform="translate(860 267)">
      <rect width="300" height="105" rx="14" class="node"/>
      <text x="22" y="35" font-size="19" font-weight="700" fill="#f0f6fc">F.U.C.K.U.P.</text>
      <text x="22" y="61" font-size="12" fill="#8b949e">corrective-learning protocol</text>
      <text x="22" y="82" font-size="11" fill="#f2cc60">flag · understand · calibrate · prevent</text>
    </g>

    <g transform="translate(130 455)">
      <rect width="320" height="105" rx="14" class="node"/>
      <text x="22" y="35" font-size="19" font-weight="700" fill="#f0f6fc">SQL CONNECTOME</text>
      <text x="22" y="61" font-size="12" fill="#8b949e">semantic SQL-family network</text>
      <text x="22" y="82" font-size="11" fill="#79c0ff">compare · translate · validate · route</text>
    </g>

    <g transform="translate(750 455)">
      <rect width="320" height="105" rx="14" class="node"/>
      <text x="22" y="35" font-size="19" font-weight="700" fill="#f0f6fc">LGCM</text>
      <text x="22" y="61" font-size="12" fill="#8b949e">learned general cognitive model</text>
      <text x="22" y="82" font-size="11" fill="#d2a8ff">adapt · recall · predict · plan</text>
    </g>

    <text x="600" y="608" text-anchor="middle" font-size="11" fill="#484f58" letter-spacing="1.3">THEBRAZENBEARD // SYSTEMS PORTFOLIO</text>
  </g>
</svg>